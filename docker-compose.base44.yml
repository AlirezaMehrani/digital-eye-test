# Base44 sandbox/dev environment.
#
# Runs the app from the cloned source with the Next.js dev server so edits
# hot-reload — never from a prebuilt image.
#
# The app is a self-contained Next.js 14 client prototype: no database, no
# backend service, no external API credentials are required.
#
# Usage:
#   docker compose -f docker-compose.base44.yml up -d --build
#   open http://localhost:3000

services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      # Bind address / port for the dev server are passed on the command line.
      - NEXT_TELEMETRY_DISABLED=1
      # Bind mounts do not always emit inotify events; force polling watchers so
      # hot reload fires on file changes made from the sandbox host.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Passed through by the platform when running in the preview sandbox.
      - BASE44_PREVIEW_MODE
    volumes:
      # Live source, so edits are reflected without rebuilding.
      - ./:/app
      # Dependencies live in a volume (not on the sandbox host) and are synced
      # from the lockfile on every start.
      - node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev -- -H 0.0.0.0 -p 3000
    healthcheck:
      # Probe real responsiveness: a dev-server compile of "/" must answer OK.
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 10

volumes:
  node_modules:
